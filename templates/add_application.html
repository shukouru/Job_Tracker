{% extends "base.html" %}
{% set title = "Add Application" %}

{% block content %}
<section class="page-heading">
    <div>
        <h1>Add Application</h1>
        <p class="muted">Use sample or non-sensitive data for shared testing.</p>
    </div>
</section>

{% if error %}
    <div class="alert error">{{ error }}</div>
{% endif %}

{% set selected_status = form.get("status") or "未応募" %}

<form action="{{ url_for('add_application') }}" method="POST" class="form-panel">
    <label class="field">
        <span>Company / 企業名</span>
        <input
            type="text"
            name="company"
            value="{{ form.get('company') or '' }}"
            placeholder="Example Company"
            required
        >
    </label>

    <label class="field">
        <span>Position / 職種</span>
        <input
            type="text"
            name="position"
            value="{{ form.get('position') or '' }}"
            placeholder="Software Engineer Intern"
            required
        >
    </label>

    <div class="form-grid">
        <label class="field">
            <span>Status / 状態</span>
            <select name="status" required>
                {% for item in statuses %}
                    <option value="{{ item }}" {% if selected_status == item %}selected{% endif %}>{{ item }}</option>
                {% endfor %}
            </select>
        </label>

        <label class="field">
            <span>Deadline / 締切</span>
            <input type="date" name="deadline" value="{{ form.get('deadline') or '' }}">
        </label>
    </div>

    <div class="form-grid">
        <label class="field">
            <span>Acceptance Rate / 採用倍率</span>
            <input
                type="text"
                name="acceptance_rate"
                value="{{ form.get('acceptance_rate') or '' }}"
                placeholder="20倍, 5%, about 1 in 100"
            >
        </label>

        <label class="field">
            <span>Starting Salary / 初年給</span>
            <input
                type="text"
                name="starting_salary"
                value="{{ form.get('starting_salary') or '' }}"
                placeholder="5,000,000円, $70,000"
            >
        </label>
    </div>

    <label class="field">
        <span>Memo / メモ</span>
        <textarea name="memo" placeholder="Notes, next action, interview date">{{ form.get('memo') or '' }}</textarea>
    </label>

    <div class="actions">
        <button type="submit">Add Application</button>
        <a class="button secondary" href="{{ url_for('show_applications') }}">Cancel</a>
    </div>
</form>
{% endblock %}
