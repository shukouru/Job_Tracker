{% extends "base.html" %}
{% set title = "Register" %}

{% block content %}
<section class="auth-layout">
    <div class="auth-copy">
        <h1>Create Account</h1>
        <p class="muted">
            テスト利用者ごとに応募データを分けて保存します。ユーザー名は本名でなくても構いません。
        </p>
    </div>

    <form action="{{ url_for('register') }}" method="POST" class="form-panel auth-panel">
        {% if error %}
            <div class="alert error">{{ error }}</div>
        {% endif %}

        <label class="field">
            <span>Username</span>
            <input
                type="text"
                name="username"
                value="{{ form.get('username') or '' }}"
                autocomplete="username"
                placeholder="student01"
                required
            >
        </label>

        <label class="field">
            <span>Password</span>
            <input
                type="password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                required
            >
        </label>

        <label class="field">
            <span>Confirm Password</span>
            <input
                type="password"
                name="confirm_password"
                autocomplete="new-password"
                minlength="8"
                required
            >
        </label>

        <button type="submit">Create Account</button>

        <p class="form-note">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>
    </form>
</section>
{% endblock %}
