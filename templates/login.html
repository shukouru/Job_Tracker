{% extends "base.html" %}
{% set title = "Login" %}

{% block content %}
<section class="auth-layout">
    <div class="auth-copy">
        <h1>Login</h1>
        <p class="muted">
            自分の応募データだけを表示するため、利用前にログインしてください。
        </p>
    </div>

    <form action="{{ url_for('login') }}" method="POST" class="form-panel auth-panel">
        {% if error %}
            <div class="alert error">{{ error }}</div>
        {% endif %}

        <input type="hidden" name="next" value="{{ next_url or '' }}">

        <label class="field">
            <span>Username</span>
            <input
                type="text"
                name="username"
                value="{{ form.get('username') or '' }}"
                autocomplete="username"
                required
            >
        </label>

        <label class="field">
            <span>Password</span>
            <input
                type="password"
                name="password"
                autocomplete="current-password"
                required
            >
        </label>

        <button type="submit">Login</button>

        <p class="form-note">
            No account yet?
            <a href="{{ url_for('register') }}">Create one</a>
        </p>
    </form>
</section>
{% endblock %}
